name: joke-generator
summary: >
  Technical analysis of LangGraph wrapper implementation for node-level chaos injection.
  The wrapper already exists at v0.5.0 with core functionality in place; research focuses
  on identifying gaps, enhancing state management, and ensuring comprehensive testing coverage.
  Key decisions address state corruption granularity, metrics collection patterns, recovery
  verification, dynamic node selection, and concurrent execution handling.

relatedFeatures:
  - 001-core-balaganagent-framework

technologies:
  - Python 3.10+
  - LangGraph (>= 0.2.0) - Graph-based workflow execution
  - LangChain (>= 0.1.0) - Foundation library for tools and chains
  - LangChain-Core (>= 0.1.0) - Tool definitions and interfaces
  - pytest >= 7.0 - Test framework
  - pytest-asyncio >= 0.21 - Async test support
  - python-dotenv >= 1.0.0 - Configuration management
  - typing (built-in) - Type hints and protocols
  - dataclasses (built-in) - Data structure definitions
  - time (built-in) - Timing and metrics

relatedLinks:
  - https://python.langchain.com/docs/langgraph/
  - https://langchain-ai.github.io/langgraph/
  - https://python.langchain.com/docs/concepts/tools/
  - https://github.com/arielshad/balagan-agent

decisions:
  - title: "State Corruption Granularity: Field-Level vs Entire State Objects"
    chosen: "Field-level corruption with targeted field selection"
    rejected:
      - "Entire state objects - simpler to implement but lacks precision required for debugging state issues in complex graphs; cannot isolate which state element caused failures"
      - "Random field selection - provides granularity but removes determinism needed for reproducibility and debugging"
    rationale: >
      Field-level corruption aligns with the requirement for "fine-grained control" stated
      in the feature summary. This approach enables precise debugging of which state elements
      cause failures, mirrors how developers actually debug state issues, and allows users
      to simulate realistic failure scenarios (e.g., corrupting only "messages" field while
      preserving control flow fields). The implementation should leverage dataclass field
      introspection and deep copy semantics to safely corrupt specific fields.

  - title: "State Snapshot Capture Strategy: Always vs On-Failure"
    chosen: "Always capture before/after snapshots when chaos is injected"
    rejected:
      - "Capture on failure only - reduces memory overhead but breaks debugging capabilities; developers cannot see what state corruption actually occurred if recovery succeeds"
      - "No snapshots - minimal overhead but eliminates observability; framework philosophy emphasizes full audit trails"
    rationale: >
      Proper debugging of state corruption requires understanding what changed. The framework
      is designed around comprehensive observability (Observable Chaos principle). Memory
      overhead is acceptable for test environments (100MB limit for typical 10MB state).
      Always capturing enables audit trails, reproducible debugging, and better MTTR
      analysis. Implementation should use deep copy (copy.deepcopy) for isolation.

  - title: "Recovery Verification After Node Failures"
    chosen: "Automatic retry within same execution with MTTR tracking"
    rejected:
      - "Manual external recovery - cleaner separation of concerns but impractical; requires external orchestration and loses realistic production behavior"
      - "No recovery mechanism - simpler but unrealistic; LangGraph graphs naturally handle node failures with retries in production"
    rationale: >
      Automatic retry simulates how LangGraph graphs naturally handle failures, enables
      measurement of actual MTTR (mean time to recovery), and matches how users will
      actually run these graphs in production. This approach allows tracking recovery
      success/failure and analyzing cascading failure patterns. Use exponential backoff
      with configurable retry counts and delays.

  - title: "Dynamic Node Selection for Chaos Injection"
    chosen: "Full dynamic selection supporting name, regex, and tag-based targeting"
    rejected:
      - "Static configuration only - simpler API but less flexible; cannot enable focused testing of specific workflows or A/B testing different scenarios"
      - "No dynamic selection - harder to use; requires code changes for different test scenarios"
    rationale: >
      Dynamic selection enables focused testing of specific workflows, supports A/B testing
      different failure scenarios without code changes, and provides the flexibility promised
      in the feature requirements. Implementation should use compiled regex patterns for
      performance and support tag-based filtering via node metadata. Pattern matching should
      be case-sensitive by default with optional flags.

  - title: "Concurrent Node Execution Handling in Chaos Injection"
    chosen: "Full concurrency awareness with thread-safe metrics collection"
    rejected:
      - "Sequential-only model - simpler to test but unrealistic; LangGraph explicitly supports parallel node execution which is a key feature"
      - "No concurrency support - avoids complexity but produces unrealistic results; concurrent failures are common in production"
    rationale: >
      LangGraph supports parallel node execution (a key feature of graph-based workflows).
      Realistic failure scenarios require handling concurrent failures. Thread-safe metrics
      using threading.Lock or similar primitives is manageable given existing architecture.
      This enables testing of fault coordination, cascade detection, and parallel recovery.

  - title: "Node Execution Timing Metrics Collection"
    chosen: "Capture both node execution and edge traversal timing with detailed breakdown"
    rejected:
      - "Node execution only - simpler metrics but misses graph-level control flow anomalies; cannot detect delays introduced by state corruption propagation"
      - "Manual timing - puts burden on users; error-prone and inconsistent"
    rationale: >
      Edge timing helps detect control flow anomalies caused by chaos injection, supports
      analysis of graph efficiency impacts, and follows the comprehensive observability
      pattern. Capture: node_start, node_end, edge_start, edge_end, and correlate with
      fault injection events. This enables correlation analysis between state corruption
      and downstream latency.

  - title: "Injector Configuration Scope: Global vs Per-Node vs Per-Tool"
    chosen: "Hierarchical configuration with defaults at wrapper level, overridable per node/tool"
    rejected:
      - "Global only - simpler but inflexible; cannot tune different nodes differently (e.g., higher failure rate for external tool calls, lower for internal state nodes)"
      - "Per-node/tool only - no flexibility for sensible defaults; verbose configuration"
    rationale: >
      Hierarchical configuration provides sensible defaults while enabling fine-grained
      control. Matches existing BalaganAgent patterns (ChaosEngine + ToolProxy model).
      Implementation should allow: (1) Default injectors at wrapper level, (2) Override
      per node via wrap_node(), (3) Override per tool via add_injector().

  - title: "Handling Cyclic Graphs and State Loops"
    chosen: "Track execution path with cycle detection; prevent infinite loops via depth limits"
    rejected:
      - "Allow unlimited cycles - can cause infinite loops if chaos injection breaks loop termination conditions"
      - "Disallow cycles - breaks support for valid LangGraph patterns like agent loops or retry loops"
    rationale: >
      Many LangGraph patterns use cycles (agent loops, retry loops). Implementation should
      track node execution depth/count per cycle and enforce configurable max_depth limit
      to prevent infinite loops if chaos corrupts loop termination. Metrics should include
      cycle count and depth statistics.

  - title: "Export Strategy: Module Exports and Package Integration"
    chosen: "Export LangGraphWrapper from balaganagent.__init__.py alongside other wrappers"
    rejected:
      - "Keep internal only - breaks discoverability; users won't know it exists"
      - "Export with different module path - inconsistent with existing wrapper exports (CrewAI, AutoGen, LangChain)"
    rationale: >
      Consistency with existing wrapper exports. Users expect all wrappers at package level.
      Add to: `from balaganagent.wrappers.langgraph import LangGraphWrapper` and then
      export in __init__.py: `__all__ = [..., "LangGraphWrapper"]`.

  - title: "Test Coverage Strategy for Node-Level Chaos"
    chosen: "Comprehensive unit tests per injector type, integration tests for multi-node scenarios, property-based testing for reproducibility"
    rejected:
      - "Unit tests only - missing integration gaps; cannot catch node-interaction failures or cascade effects"
      - "Integration tests only - difficult to debug specific failure modes; slow test execution"
    rationale: >
      Balanced approach achieves >85% coverage target. Unit tests cover: node wrapping,
      injector application, field-level state corruption, retry logic, metrics per node.
      Integration tests cover: multi-node DAGs, parallel execution, state snapshot accuracy,
      recovery timing. Property-based tests (hypothesis) verify reproducibility with seeds.

  - title: "Performance Optimization: Overhead Reduction Techniques"
    chosen: "Lazy field introspection, cached regex patterns, thread pool for async metrics collection"
    rejected:
      - "Eager field introspection - inspects all fields on every node execution even if not targeted; slow"
      - "No caching - recompiles regex patterns for every decision check; wasteful"
    rationale: >
      <5% overhead requirement is achievable with targeted optimizations: (1) Cache field
      names on first graph wrapping, (2) Pre-compile regex patterns in __init__, (3) Only
      introspect fields when actually applying corruption, (4) Use thread pool for async
      metrics to avoid blocking node execution.

openQuestions:
  - question: "Should state field mutation use deep copy or write-on-copy semantics?"
    resolved: true
    options:
      - option: "Deep copy with in-place mutation"
        description: >
          Create complete deep copy of state before corruption, modify in place, return
          modified copy. Safest approach, no side effects on original state. Higher memory
          use temporarily.
        selected: true
      - option: "Write-on-copy (copy-on-write)"
        description: >
          Only copy fields that are modified. More memory efficient but requires tracking
          which fields were modified. More complex implementation.
        selected: false
      - option: "In-place mutation with snapshots"
        description: >
          Mutate original state and snapshot before/after. Simplest but risks side effects
          if exception handling doesn't restore correctly.
        selected: false
    selectionRationale: >
      Deep copy is safest and most predictable. LangGraph state objects are typically
      small (TypedDicts with message lists, metadata). Cost of deep copy is negligible
      vs complexity of alternatives. Matches existing pattern in metrics collectors.

  - question: "How should async node execution be handled with chaos injection?"
    resolved: true
    options:
      - option: "Wrap async functions with async proxies, inject at await boundaries"
        description: >
          Create LangGraphNodeProxyAsync for async node functions. Inject faults before
          and after await. Handles async context properly but requires separate proxy class.
        selected: true
      - option: "Convert async to sync for injection, then re-await"
        description: >
          Use asyncio.run() to execute async nodes synchronously during injection. Simpler
          but can break async context and cause event loop issues.
        selected: false
      - option: "No async support, only sync nodes"
        description: >
          Simplest but incompatible with modern LangGraph patterns which are increasingly async.
        selected: false
    selectionRationale: >
      Async nodes are critical in modern LangGraph (astream, ainvoke). Separate async
      proxy (LangGraphNodeProxyAsync) maintains context and allows proper async timing.
      Use asyncio timing utilities for accurate metrics. Keep synchronization primitives
      (locks) for thread-safe metrics in concurrent scenarios.

  - question: "Should recovered nodes re-execute the same function or skip to next?"
    resolved: true
    options:
      - option: "Re-execute same function with fresh state"
        description: >
          If node fails due to chaos, retry the exact same node with unmodified input.
          Most realistic, enables MTTR measurement, matches production behavior.
        selected: true
      - option: "Skip to next node with current state"
        description: >
          If node fails, proceed to next node without retrying. Simpler logic but unrealistic;
          production graphs don't skip failed steps.
        selected: false
      - option: "User-defined recovery strategy"
        description: >
          Allow custom recovery handlers per node. Flexible but complex; requires callback
          mechanism.
        selected: false
    selectionRationale: >
      Re-execution matches LangGraph's built-in retry behavior. Enables realistic MTTR
      measurement (actual time to recover, not time to skip). Allows cascading failure
      analysis when retries fail. Configurable max_retries prevents infinite loops.

  - question: "How should metrics be aggregated across concurrent node executions?"
    resolved: true
    options:
      - option: "Per-node metrics with timestamp correlation"
        description: >
          Track metrics per node with precise timestamps. Aggregate across nodes using
          timestamps. Enables correlation analysis of concurrent failures.
        selected: true
      - option: "Sequential aggregation treating concurrent as sequential"
        description: >
          Aggregate as if concurrent nodes ran sequentially. Simpler but loses information
          about concurrent failure patterns.
        selected: false
      - option: "Separate concurrent and sequential metrics"
        description: >
          Track metrics separately for concurrent vs sequential execution. More complex;
          duplication.
        selected: false
    selectionRationale: >
      Timestamp-based correlation enables rich analysis: which concurrent nodes failed
      simultaneously, cascade timing, synchronization issues. Use nanosecond precision
      (time.time_ns()) for accuracy. Aggregate via time windows and correlation analysis.

content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-03-15
  - **Implementation Status:** Wrapper exists at v0.5.0; research focuses on enhancements and gaps

  ## Overview

  The LangGraph wrapper for BalaganAgent already exists in the codebase but requires
  enhancement, comprehensive testing, and documentation to meet the feature requirements.
  The existing implementation provides:

  - LangGraphToolProxy for tool-level chaos injection
  - LangGraphNodeProxy for node-level fault injection
  - LangGraphWrapper orchestrating both
  - Basic metrics collection via MetricsCollector
  - Experiment support via Experiment classes

  Gaps identified through code review:
  - Limited state corruption (no field-level targeting)
  - Missing edge traversal timing in metrics
  - No state snapshot capture before/after chaos
  - Incomplete async/concurrent execution handling
  - Insufficient test coverage for multi-node scenarios

  ## Technology Stack Analysis

  ### Core Dependencies

  **LangGraph (>= 0.2.0)**
  - Purpose: Graph-based workflow execution with nodes and edges
  - Status: Used by wrapper, already in optional dependencies
  - Key concepts: StateGraph, CompiledGraph, nodes dict, stream/invoke/batch APIs
  - Consideration: StateGraph API changed between 0.1.x and 0.2.x; ensure compatibility

  **LangChain (>= 0.1.0) + LangChain-Core (>= 0.1.0)**
  - Purpose: Tool definitions (BaseTool) and interfaces
  - Status: Core dependency, already in project
  - Key concepts: BaseTool with name/func attributes, tool calling protocol
  - No breaking changes expected in this version range

  **Python 3.10+**
  - Purpose: Type hints (typing module), dataclasses, async/await
  - Status: Project targets 3.10+
  - Key features used: typing.TypeVar, typing.cast, dataclass.field, async context managers

  **Testing Stack (pytest, pytest-asyncio, pytest-cov)**
  - Purpose: Unit and integration testing with async support
  - Status: Already in dev dependencies
  - Consideration: Use pytest.mark.asyncio for async tests; asyncio_mode = "auto" in pyproject.toml

  ### Libraries Rejected

  **hypothesis (property-based testing)**
  - Decision: Conditional use only for reproducibility tests
  - Reasoning: Adds dependency for limited use case; can verify reproducibility with manual seeding instead
  - Alternative: Use pytest.mark.parametrize for deterministic test cases

  **asyncio (async utilities)**
  - Decision: Use built-in asyncio instead of external wrapper
  - Reasoning: Standard library sufficient; minimal version targeting 3.10 has all needed APIs

  **contextvars (async context propagation)**
  - Decision: Use for propagating chaos configuration across async contexts
  - Reasoning: Standard library, required for proper async context isolation in concurrent scenarios

  **threading (sync primitives)**
  - Decision: Use for thread-safe metrics collection
  - Reasoning: Standard library Lock/RLock sufficient; avoid Semaphore complexity for now

  ## Architecture Decisions

  ### 1. State Corruption Field-Level Granularity

  **Decision:** Implement field-level targeting with dataclass field introspection.

  **Implementation Details:**
  ```python
  # Corruption targeting strategy:
  # 1. Inspect state TypedDict or dataclass fields
  # 2. Allow specifying target fields: ["messages", "context"]
  # 3. Deep copy state, modify only targeted fields
  # 4. Corrupt via type-appropriate methods (string mutation, list shuffling, etc.)
  # 5. Preserve control flow fields (graph control flags)
  ```

  **Benefits:**
  - Precise debugging: isolate which state element caused failure
  - Realistic scenarios: simulate corruption of specific message fields, context, metadata
  - Reproducibility: same seed produces same field corruption
  - Safety: internal control flow fields can be excluded from corruption

  ### 2. State Snapshot Architecture

  **Decision:** Capture complete state snapshots before and after chaos injection via deep copy.

  **Implementation:**
  ```python
  @dataclass
  class StateSnapshot:
      timestamp: float
      node_name: str
      state_before: Any  # Deep copy
      state_after: Any   # Deep copy
      fault_injected: Optional[str]
      field_targets: Optional[list[str]]
  ```

  **Storage Strategy:**
  - Store in node proxy (LangGraphNodeProxy._snapshots)
  - Accessible via get_state_snapshots() -> list[StateSnapshot]
  - Included in metrics for post-execution analysis
  - Compressed serialization for large states (optional)

  ### 3. Metrics Collection: Node-Level and Edge-Level Timing

  **Decision:** Implement dual-level timing with correlation capability.

  **Metrics Structure:**
  ```python
  # Node-level metrics:
  # - execution_start: timestamp when node began
  # - execution_end: timestamp when node completed
  # - duration_ms: execution time
  # - fault_injected: fault type if chaos was applied
  # - recovery_attempts: number of retries
  # - recovery_success: whether recovery succeeded

  # Edge-level metrics:
  # - edge_id: source_node -> target_node
  # - traversal_start: when control left source node
  # - traversal_end: when control entered target node
  # - delay_ms: time between nodes (should be ~0 for direct edges)
  # - state_mutation_size: size of state change between nodes
  ```

  **Implementation:** Extend MetricsCollector to track edges; use node execution hooks to detect transitions.

  ### 4. Recovery Mechanism with MTTR Tracking

  **Decision:** Automatic retry with exponential backoff; track actual recovery time.

  **Configuration:**
  ```python
  @dataclass
  class NodeRetryConfig:
      max_retries: int = 3
      initial_delay: float = 0.1  # seconds
      backoff_multiplier: float = 2.0  # exponential backoff
      max_delay: float = 10.0  # cap delay at 10s
  ```

  **MTTR Calculation:**
  - Start: when failure first detected
  - End: when successful recovery or final failure
  - Formula: MTTR = sum of retry delays + re-execution times

  ### 5. Dynamic Node Selection

  **Decision:** Support three selection modes: exact name, regex patterns, tag-based.

  **Implementation:**
  ```python
  wrapper.wrap_node("agent_node")  # Exact match
  wrapper.wrap_node("^tool_.*")    # Regex pattern
  wrapper.wrap_node(tags=["external_api"])  # Tag-based (requires node metadata)
  ```

  **Performance Optimization:**
  - Pre-compile regex patterns at wrapper init
  - Cache node names at graph wrapping time
  - Match selection at wrap time, not execution time

  ### 6. Concurrent Execution Handling

  **Decision:** Thread-safe metrics with timestamp-based correlation; no global locks on node execution.

  **Key Mechanisms:**
  ```python
  # Thread-safe metrics using threading.Lock
  self._metrics_lock = threading.RLock()

  # Timestamp-based correlation
  # Record node execution with thread_id and timestamp
  # Aggregate metrics using time windows (e.g., operations within 100ms are concurrent)
  ```

  **Concurrency Scenarios:**
  - Multiple nodes executing in parallel: each has own proxy, executes independently
  - Same node called concurrently: thread-safe counter via lock
  - Metrics aggregation: lock-protected during summarization only

  ### 7. Async Execution Support

  **Decision:** Create separate LangGraphNodeProxyAsync for async node functions.

  **Implementation Pattern:**
  ```python
  class LangGraphNodeProxyAsync:
      async def __call__(self, state: Any) -> Any:
          event = LangGraphNodeEvent(...)
          # Inject faults async-aware
          # Track timing with asyncio
          # Return state
  ```

  **Key Differences from Sync:**
  - Use asyncio.get_event_loop() for timing
  - Support async injectors (some faults may need async operations)
  - Proper async context propagation via contextvars

  ## Implementation Roadmap

  ### Phase 1: Enhance State Management (Core)
  - [ ] Implement StateSnapshot dataclass with deep copy semantics
  - [ ] Add field-level state corruption targeting to ContextCorruptionInjector
  - [ ] Update node proxy to capture before/after snapshots
  - [ ] Add state consistency checking (detect unexpected mutations)

  ### Phase 2: Improve Metrics Collection (Observability)
  - [ ] Add edge traversal timing via graph transition hooks
  - [ ] Extend MetricsCollector with edge-level metrics
  - [ ] Implement MTTR calculation with retry tracking
  - [ ] Add state snapshot size tracking

  ### Phase 3: Enhance Node Selection (Flexibility)
  - [ ] Add regex pattern matching for node names
  - [ ] Implement tag-based selection via node metadata
  - [ ] Pre-compile patterns and cache at wrapper init
  - [ ] Add selection validation and error messages

  ### Phase 4: Handle Concurrency (Realism)
  - [ ] Add threading.Lock to MetricsCollector for thread-safe operations
  - [ ] Implement concurrent node execution detection
  - [ ] Add timestamp-based correlation for concurrent operations
  - [ ] Test multi-threaded scenarios

  ### Phase 5: Async Support (Modern Patterns)
  - [ ] Create LangGraphNodeProxyAsync for async nodes
  - [ ] Update wrap_node() to detect and wrap async functions
  - [ ] Implement async fault injection where needed
  - [ ] Test with astream and ainvoke

  ### Phase 6: Testing & Documentation (Quality)
  - [ ] Write comprehensive unit tests for state corruption
  - [ ] Add integration tests for multi-node DAGs and cycles
  - [ ] Create property-based tests for reproducibility
  - [ ] Write LangGraph integration guide with examples
  - [ ] Document node selection strategies and metrics interpretation

  ## Security Considerations

  ### State Data Safety

  **Risk:** State snapshots contain potentially sensitive data (API keys, user data, LLM responses).

  **Mitigation:**
  - Make snapshot capture opt-in via configuration flag
  - Support snapshot filtering/masking of sensitive fields
  - Document that snapshots are kept in memory (not persisted to disk by default)
  - Warn users not to print snapshots to logs

  ### Injection Attack via Field Names

  **Risk:** User-supplied field names in state corruption could enable arbitrary field access.

  **Mitigation:**
  - Validate field names against actual state schema
  - Whitelist valid fields at wrapper initialization
  - Reject invalid field names with clear error messages

  ### Infinite Loops via Cycle Injection

  **Risk:** Chaos injection could corrupt loop termination conditions, causing infinite loops.

  **Mitigation:**
  - Implement configurable max_depth limit per cycle
  - Track execution depth in addition to node count
  - Raise TimeoutError if depth exceeded
  - Document which fields should be excluded from corruption (loop counters, flags)

  ## Performance Implications

  ### Overhead Analysis (Target: <5%)

  **Baseline overhead (no faults):**
  - Tool wrapping: ~0.1ms per tool call (negligible)
  - Node wrapping: ~0.05ms per node execution (negligible)
  - Metrics collection: ~0.2ms per operation (under 1% for typical operations)
  - State snapshots: ~1-2ms per snapshot (only when fault injected)

  **Total baseline:** ~0.35ms per node = 0.35% overhead for 1s node execution

  ### Optimizations Implemented

  **1. Lazy Field Introspection**
  - Cache field names at wrapper initialization
  - Only introspect fields when applying corruption
  - Cost: O(1) lookup instead of O(n) per injection

  **2. Regex Pattern Caching**
  - Pre-compile patterns in wrap_node()
  - Reuse compiled patterns for all executions
  - Cost: O(1) matching instead of re-compilation per check

  **3. Metrics Collection Batching**
  - Batch metrics writes during concurrent execution
  - Flush to summary only when requested
  - Cost: O(1) per operation, O(n) for summary generation

  **4. State Snapshot Compression**
  - Optional: Use pickle or JSON serialization for storage
  - Compress large states (>10MB) automatically
  - Cost: ~10ms per compression (trade-off for memory savings)

  ## Integration Points

  ### Existing Components Used

  - **ChaosEngine:** Core orchestration (unused directly, but pattern compatible)
  - **BaseInjector:** All injector types work with node proxies
  - **MetricsCollector:** Extended for node/edge metrics
  - **MTTRCalculator:** Tracks recovery metrics
  - **Experiment/ExperimentConfig:** Support experiment lifecycle
  - **ExperimentResult:** Report experiment outcomes

  ### Package Exports

  Current `balaganagent/__init__.py` should include:
  ```python
  from .wrappers.langgraph import LangGraphWrapper

  __all__ = [
      # ... existing exports ...
      "LangGraphWrapper",
  ]
  ```

  ### Example Integration

  ```python
  from langgraph.graph import StateGraph
  from balaganagent.wrappers.langgraph import LangGraphWrapper
  from balaganagent.injectors import ToolFailureInjector

  # Build and compile graph
  graph = StateGraph(AgentState)
  # ... add nodes and edges ...
  compiled = graph.compile()

  # Wrap with chaos
  wrapper = LangGraphWrapper(compiled, chaos_level=0.5)
  wrapper.wrap_node("tool_executor", injectors=[ToolFailureInjector(...)])
  wrapper.configure_chaos(enable_tool_failures=True, enable_delays=True)

  # Run with chaos
  result = wrapper.invoke({"messages": [...]})

  # Analyze metrics
  metrics = wrapper.get_metrics()
  mttr_stats = wrapper.get_mttr_stats()
  ```

  ## Test Strategy

  ### Unit Tests (50% coverage)
  - Node wrapping and proxy creation
  - Field-level state corruption targeting
  - Retry logic and backoff calculations
  - Regex pattern matching for node selection
  - Metrics collection per node
  - MTTR calculation accuracy
  - State snapshot deep copy isolation

  ### Integration Tests (35% coverage)
  - Single-node graphs with tool failures
  - Multi-node DAGs with sequential execution
  - Parallel node execution with concurrent faults
  - Cyclic graphs with loop termination
  - State snapshot accuracy before/after
  - Recovery time measurement
  - Edge traversal timing accuracy
  - Full experiment lifecycle

  ### Property-Based Tests (Reproducibility)
  - Same seed produces deterministic state corruption
  - State snapshots accurately reflect mutations
  - MTTR calculations consistent across runs
  - Metrics aggregation commutative

  ### Performance Tests
  - Baseline overhead measurement (<5% target)
  - State snapshot memory usage (100MB limit)
  - Metrics collection throughput (1000s ops/sec)
  - Large graph handling (100+ nodes)

  ### Test Coverage Target
  - Overall: >85% of wrapper code paths
  - Node-level chaos: 100% of node proxy code
  - State corruption: 100% of field targeting logic
  - Metrics: 100% of collection and aggregation
  - Recovery: 100% of retry and MTTR logic

  ## Library Selection Rationale

  | Library | Purpose | Status | Why Choose | Why Reject Alternative |
  |---------|---------|--------|-----------|------------------------|
  | LangGraph | Graph execution | Use | Primary target; needed for node/edge wrapping | N/A |
  | LangChain | Tool definitions | Use | Core dependency; tool interface | N/A |
  | pytest | Testing | Use | Project standard; async support via pytest-asyncio | unittest (too verbose) |
  | pytest-asyncio | Async testing | Use | Native async/await test support | pytest-trio (narrower scope) |
  | dataclasses | Data structures | Use | Built-in; cleaner than namedtuple; snapshot modeling | attrs (external dep) |
  | typing | Type hints | Use | Built-in; comprehensive; mypy compatible | typeshed (separate) |
  | threading | Metrics sync | Use | Built-in; sufficient for lock-based synchronization | multiprocessing (overkill) |
  | asyncio | Async support | Use | Built-in; timing utilities; event loop | trio (different ecosystem) |
  | copy | Deep copy semantics | Use | Built-in; safe for state snapshot isolation | custom copying (error-prone) |
  | hypothesis | Property testing | Reject | Limited use case; can verify with parametrized tests | Reduces test speed |
  | pydantic | Validation | Reject | Config objects use dataclasses already; simple validation | Adds dependency |

  ## Gaps and Limitations

  ### Current Implementation Gaps

  1. **State Snapshots:** Not currently captured
     - Gap: Cannot analyze what state corruption occurred
     - Fix: Implement StateSnapshot dataclass and capture in node proxy

  2. **Field-Level Corruption:** Not implemented
     - Gap: Only entire state can be corrupted; no precision
     - Fix: Extend ContextCorruptionInjector with field targeting

  3. **Edge Timing:** Not tracked
     - Gap: Cannot analyze control flow delays
     - Fix: Add edge event tracking in metrics collector

  4. **Async Nodes:** Limited support
     - Gap: Async node execution timing may be inaccurate
     - Fix: Create LangGraphNodeProxyAsync with proper async handling

  5. **Concurrent Metrics:** Not aggregated with correlation
     - Gap: Cannot analyze concurrent failure patterns
     - Fix: Implement timestamp-based correlation in metrics

  ### Known Limitations

  1. **State Size:** Deep copy overhead for large states (>50MB)
     - Workaround: Implement snapshot compression or sampling

  2. **Cyclic Graphs:** No automatic loop detection
     - Workaround: Configure max_depth limit; document loop detection

  3. **Remote Graphs:** Only local compiled graphs supported
     - Future: Remote graph execution via RPC

  4. **Custom State Types:** Limited to TypedDict and dataclasses
     - Workaround: Document expected state schema patterns

  ## Conclusion

  The LangGraph wrapper foundation is solid and production-ready for basic scenarios.
  The proposed enhancements—state snapshots, field-level corruption, edge timing,
  async support, and concurrent metrics—address key gaps and enable comprehensive
  reliability testing of complex LangGraph-based workflows.

  The field-level state corruption strategy provides the fine-grained control required
  for precise debugging and realistic failure simulation. Timestamp-based metrics
  correlation enables analysis of concurrent failures and cascade detection. Automatic
  retry with MTTR tracking provides production-realistic recovery measurement.

  Implementation priority should be: (1) State snapshots + field-level corruption,
  (2) Edge timing + MTTR, (3) Async support, (4) Concurrent metrics, (5) Testing.
  This enables incremental value delivery while maintaining stability.

