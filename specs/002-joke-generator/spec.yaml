    answer: 'Yes - full dynamic selection'

  - question: 'Should concurrent node execution be considered when injecting chaos?'
    resolved: true
    options:
      - option: 'Yes - with concurrency awareness'
        description: 'Track concurrent execution, inject failures considering parallelism. More realistic but significantly more complex to implement and test.'
        selected: true
