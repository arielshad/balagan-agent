content: |
  ## Problem Statement

  BalaganAgent is a chaos engineering framework for AI agents that enables stress-testing through controlled fault injection.
  Currently it provides wrappers for CrewAI, AutoGen, and LangChain agents. The framework is missing comprehensive support for LangGraph,
  which is an increasingly popular framework for building complex, stateful agent workflows using a graph-based execution model.

  LangGraph differs from other agent frameworks in that it explicitly models workflows as directed graphs with nodes and edges,
  requiring a different approach to chaos injection compared to sequential task-based frameworks. This feature will add
  comprehensive LangGraph support with node-level granularity for fault injection.

  The existing implementation (v0.5.0) provides a foundation but requires completion, hardening, and comprehensive testing to ensure
  production-ready reliability testing for LangGraph-based agents.

  ## Success Criteria

  - [ ] LangGraphWrapper successfully wraps LangGraph StateGraph instances with configurable chaos injection
  - [ ] Node-level chaos injection works with field-level state corruption, allowing targeting specific state fields
  - [ ] Edge traversal timing is captured and reported in metrics output
  - [ ] State snapshots (before/after chaos) are captured and accessible via metrics API
  - [ ] Automatic node retry mechanism functions correctly with recovery time tracking
  - [ ] Dynamic node selection supports name-based, regex-based, and tag-based targeting
  - [ ] Concurrent node execution is handled without race conditions in metrics/chaos injection
  - [ ] All injector types (tool_failure, delay, hallucination, context, budget) work at node level
  - [ ] Metrics collection includes node MTTR, edge traversal time, and state consistency checks
  - [ ] Comprehensive test suite covers >85% of wrapper code paths
  - [ ] Integration tests verify end-to-end workflows with multi-node graphs, state corruption, and recovery
  - [ ] Documentation includes LangGraph-specific integration guide with working examples
  - [ ] LangGraphWrapper is exported from balaganagent package __init__.py
  - [ ] Backward compatibility maintained with existing core chaos engine and injectors
  - [ ] Performance impact <5% on baseline graph execution without chaos

  ## Functional Requirements

  ### Core Wrapper Functionality

  - **FR-1**: LangGraphWrapper must accept a compiled LangGraph StateGraph and return a wrapped version supporting chaos injection
  - **FR-2**: Wrapper must maintain graph topology (nodes, edges, state schema) without modification
  - **FR-3**: Chaos injection configuration must be supplied via ChaosConfig object with sensible defaults
  - **FR-4**: Execution of wrapped graph must be transparent - users call graph.invoke() or graph.stream() without awareness of chaos injection

  ### Node-Level Chaos Injection

  - **FR-5**: Support node-level fault injection via all existing injector types: tool_failure, delay, hallucination, context, budget
  - **FR-6**: Node selection mechanism must support: exact name matching, regex patterns, tag-based filtering
  - **FR-7**: State corruption must operate at field level - users can specify which state fields are targeted for corruption
  - **FR-8**: Chaos injection must not corrupt state fields used for internal control flow or graph execution
  - **FR-9**: Failed nodes must automatically retry with configurable retry counts and backoff strategies
  - **FR-10**: Concurrent node execution must be supported - chaos can be injected into nodes executing in parallel

  ### State Management

  - **FR-11**: State snapshots (complete state object) must be captured before and after node execution when chaos is injected
  - **FR-12**: State snapshots must be accessible via results object for post-execution analysis
  - **FR-13**: State corruption must be predictable and reproducible with same random seed

  ### Metrics and Observability

  - **FR-14**: Node-level execution time must be tracked (start, end, duration)
  - **FR-15**: Edge traversal time must be measured (time between nodes, including control flow decisions)
  - **FR-16**: Node MTTR (mean time to recovery) must be calculated for each node experiencing failures
  - **FR-17**: State consistency checks must be performed - detect unexpected state mutations caused by chaos
  - **FR-18**: Metrics must include: injection event timestamp, node name, injection type, recovery status, latency impact
  - **FR-19**: All metrics must be accessible via standardized MetricsCollector interface

  ### Configuration and Control

  - **FR-20**: ChaosConfig must support enabling/disabling chaos at wrapper level
  - **FR-21**: Per-node injection rates must be configurable (probability of injection per execution)
  - **FR-22**: Injection parameters (delay duration, corruption severity, budget limits) must be settable per injector type
  - **FR-23**: Random seed must be configurable for reproducible chaos injection
  - **FR-24**: Wrapper must support experiment definition and execution via existing Experiment classes

  ### Error Handling and Recovery

  - **FR-25**: Node failures due to chaos injection must not crash the entire graph - failures must be containable
  - **FR-26**: Recovery metadata must be recorded (retry count, recovery time, whether recovery succeeded)
  - **FR-27**: Wrapper must gracefully handle edge cases: missing nodes, concurrent modifications, empty graphs

  ## Non-Functional Requirements

  ### Performance

  - **NFR-1**: Baseline overhead of chaos injection (no faults) must be <5% compared to unwrapped graph
  - **NFR-2**: Metrics collection overhead must be O(n) where n = number of nodes executed
  - **NFR-3**: Memory usage for state snapshots must not exceed 100MB for typical 10MB state objects
  - **NFR-4**: Graph execution with chaos must complete in <2x baseline time (reasonable for fault injection)

  ### Reliability and Robustness

  - **NFR-5**: Wrapper must handle graphs with 100+ nodes without degradation
  - **NFR-6**: State snapshots must be deep copies - modifications to snapshots must not affect graph execution
  - **NFR-7**: Concurrent node execution must use thread-safe metrics collection
  - **NFR-8**: Chaos injection must be idempotent - same configuration must produce deterministic results with same seed

  ### Maintainability

  - **NFR-9**: Code must follow existing BalaganAgent patterns: composition over inheritance, tool-level interception
  - **NFR-10**: Type hints must be comprehensive - 100% of public API must be typed
  - **NFR-11**: All public methods must have docstrings following NumPy/Google style
  - **NFR-12**: Code must pass mypy type checking with strict mode

  ### Testing

  - **NFR-13**: Test coverage must be >85% of wrapper code paths
  - **NFR-14**: Integration tests must cover: single-node graphs, multi-node DAGs, cyclic graphs, parallel execution, state corruption scenarios
  - **NFR-15**: All tests must use pytest with async support via pytest-asyncio
  - **NFR-16**: Tests must complete in <60 seconds total

  ### Compatibility

  - **NFR-17**: Must support Python 3.10+
  - **NFR-18**: Must work with LangGraph >= 0.2.0
  - **NFR-19**: Must work with LangChain >= 0.1.0
  - **NFR-20**: Must be compatible with all existing BalaganAgent injectors without modification

  ### Documentation

  - **NFR-21**: Integration guide must include quickstart example (LangGraph graph with chaos)
  - **NFR-22**: Documentation must cover: node selection strategies, state corruption scenarios, metrics interpretation
  - **NFR-23**: Examples must be runnable without external dependencies (mock agents acceptable)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | State corruption granularity (field-level vs entire objects)? | Field-level granularity | Matches "fine-grained control" in feature summary; enables precise debugging; allows users to target specific state elements |
  | 2 | Include edge traversal timing in metrics? | Yes - include edge timing | Detects control flow anomalies; comprehensive observability; follows framework philosophy |
  | 3 | Always capture state snapshots or only on failure? | Always capture snapshots | Required for proper debugging of state corruption; acceptable overhead in test environments; aligns with Observable Chaos principle |
  | 4 | How to verify recovery after node failure? | Automatic retry with MTTR tracking | Realistic (matches production behavior); measurable (actual recovery time); useful (detects cascading failures) |
  | 5 | Support dynamic node selection for chaos? | Yes - full dynamic selection | Enables focused testing; supports A/B comparison; provides flexibility promised in feature |
  | 6 | Handle concurrent node execution in chaos injection? | Yes - with concurrency awareness | LangGraph supports parallelism; realistic failure scenarios; manageable complexity |

  ## Test Strategy

  ### Unit Tests

  - Test LangGraphWrapper initialization with various graph configurations
  - Test node selection (exact name, regex, tag-based)
  - Test each injector type at node level
  - Test state corruption field-level targeting
  - Test retry mechanism with various retry counts
  - Test metrics collection for individual nodes
  - Test concurrent node execution without race conditions

  ### Integration Tests

  - Multi-node DAG execution with chaos injection
  - Single-node graph with state corruption
  - Parallel node execution with concurrent failures
  - State snapshot accuracy before/after execution
  - Recovery time measurement accuracy
  - Edge traversal timing measurement
  - Full experiment lifecycle with LangGraphWrapper

  ### Performance Tests

  - Baseline overhead measurement (wrapped vs unwrapped)
  - State snapshot memory usage profiling
  - Metrics collection overhead analysis
  - Large graph (100+ nodes) execution

  ## Codebase Analysis

  ### Project Structure

  **Root Directory Layout:**
  ```
  /balaganagent/
  ├── __init__.py           # Main package exports
  ├── engine.py             # Core ChaosEngine implementation
  ├── wrapper.py            # Agent and ToolProxy classes
  ├── experiment.py         # Experiment definitions and results
  ├── runner.py             # ScenarioRunner and ExperimentRunner
  ├── reporting.py          # Report generation (terminal, JSON, markdown, HTML)
  ├── cli.py                # Command-line interface
  ├── verbose.py            # Logging utilities
  ├── hooks/                # Hook system for chaos integration
  ├── injectors/            # Fault injection implementations
  │   ├── base.py           # BaseInjector protocol
  │   ├── tool_failure.py   # Tool failure modes
  │   ├── delay.py          # Latency injection
  │   ├── hallucination.py  # Data corruption
  │   ├── context.py        # Context/state corruption
  │   └── budget.py         # Budget exhaustion
  ├── metrics/              # Metrics collection
  │   ├── collector.py      # MetricsCollector
  │   ├── mttr.py           # MTTR calculation
  │   ├── recovery.py       # Recovery quality metrics
  │   └── reliability.py    # Reliability scoring
  └── wrappers/             # Framework-specific integrations
      ├── crewai.py         # CrewAI agent wrapper
      ├── autogen.py        # AutoGen agent wrapper
      ├── langchain.py      # LangChain agent wrapper
      ├── langgraph.py      # LangGraph wrapper (TARGET - currently exists)
      ├── claude_sdk.py     # Claude Agent SDK wrapper
      ├── claude_sdk_client.py
      └── claude_sdk_hooks.py

  /tests/
  ├── test_engine.py
  ├── test_injectors.py
  ├── test_crewai_wrapper.py
  ├── test_langgraph_wrapper.py  # LangGraph-specific tests
  ├── test_langchain_wrapper.py
  ├── test_autogen_wrapper.py
  ├── test_claude_sdk_wrapper.py
  └── e2e/                       # End-to-end tests
  ```

  ### Architecture Patterns

  **Core Design Principles:**
  1. **Composition over Inheritance:** Wrappers compose fault injectors rather than inherit from base classes
  2. **Tool-Level Interception:** Chaos injection happens at the tool/function call level
  3. **Metrics Collection:** All chaos events are recorded for analysis (MTTR, recovery quality, reliability scores)
  4. **Framework Agnostic:** Core engine is framework-agnostic; wrappers adapt it to specific frameworks
  5. **Observable Chaos:** All injected faults are recorded with metadata for debugging

  **Dependency Flow:**
  ```
  Wrapper (CrewAI/LangGraph/etc)
    └─> ToolProxy / NodeProxy (tool interception layer)
        └─> ChaosEngine (core chaos logic)
            └─> Injectors (tool_failure, delay, hallucination, context, budget)
                └─> Metrics/MTTR calculators (observability)
  ```

  **Key Abstractions:**
  - `BaseInjector`: Protocol for all fault injectors (must implement `inject()` method)
  - `ChaosEngine`: Orchestrates which injectors to apply and at what frequency
  - `MetricsCollector`: Records all operations, successes, failures, latencies
  - `MTTRCalculator`: Tracks mean time to recovery for failed operations
  - `AgentWrapper`: Generic wrapper around any agent with tools
  - `ToolProxy`: Wraps individual tool functions to intercept calls
  - `CrewAIWrapper`: CrewAI-specific wrapper handling agent/task introspection
  - `LangGraphWrapper`: LangGraph-specific wrapper for node-level injection (TARGET)

  ### Relevant Technologies

  **Core Stack:**
  - **Python 3.10+:** Type hints, async/await, dataclasses
  - **pytest:** Test framework with async support via pytest-asyncio
  - **python-dotenv:** Environment configuration for API keys

  **Agent Framework Integrations:**
  - **LangGraph (target):** Graph-based workflow execution with nodes and edges
  - **LangChain:** Foundation library for tool definitions and chains
  - **CrewAI:** Role-based multi-agent framework (existing wrapper)
  - **AutoGen:** Microsoft's conversational agent framework (existing wrapper)
  - **Claude Agent SDK:** Anthropic's agent framework (existing wrappers)

  **Key LangGraph Concepts (relevant to implementation):**
  - `StateGraph`: Base class for graph definitions
  - `Nodes`: Represent computation steps
  - `Edges`: Control flow between nodes
  - `State`: Shared data structure passed between nodes
  - `Compiled Graph`: Runtime-ready graph ready for execution
  - Tool calling through LangChain's tool protocol

  ### Existing LangGraph Wrapper Status

  **Current State:** A LangGraph wrapper (`langgraph.py`) already exists in the codebase at v0.5.0
  - Located at: `balaganagent/wrappers/langgraph.py`
  - Contains ~26KB of implementation code
  - Includes node-level chaos injection
  - Has comprehensive test coverage in `test_langgraph_wrapper.py`
  - Supports state corruption and recovery scenarios

  **This means the feature may be:**
  - Already partially/fully implemented and needs documentation/testing refinement
  - Needing enhancement or bug fixes
  - Requiring integration improvements

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `balaganagent/wrappers/langgraph.py` | High | Core wrapper implementation for LangGraph nodes - may need enhancements or fixes |
  | `balaganagent/injectors/*.py` | Medium | May need new injector types specific to stateful graph execution (state edge corruption, node sequencing failures) |
  | `balaganagent/metrics/` | Medium | Graph-specific metrics needed (node recovery time, state consistency checks, edge traversal timing) |
  | `tests/test_langgraph_wrapper.py` | High | Comprehensive testing of node-level chaos scenarios, state corruption, recovery |
  | `docs/integrations.md` | Medium | LangGraph integration guide and usage examples |
  | `examples/` | Low | Example showing LangGraph agent with chaos injection |
  | `README.md` | Low | Update main README with LangGraph support mention |
  | `balaganagent/__init__.py` | Low | Export LangGraphWrapper if not already exported |

  ## Dependencies

  **External Dependencies:**
  - `langgraph >= 0.2.0` (specified in pyproject.toml optional deps)
  - `langchain >= 0.1.0` (core dependency)
  - `langchain-core >= 0.1.0` (tool definitions)
  - `python-dotenv >= 1.0.0` (env config)
  - `pytest >= 7.0` (testing)
  - `pytest-asyncio >= 0.21` (async test support)

  **Internal Dependencies:**
  - `ChaosEngine`: Core chaos orchestration
  - `BaseInjector` and injector implementations: Fault injection logic
  - `MetricsCollector` / `MTTRCalculator`: Observability
  - `ExperimentConfig` / `Experiment` / `ExperimentResult`: Experiment tracking
  - Existing wrapper patterns from `crewai.py`, `langchain.py`, `autogen.py`

  ## Size Estimate

  **M** (3-5 days) — Medium Complexity

  **Reasoning:**
  - **Existing Implementation:** LangGraph wrapper already exists, reducing greenfield work
  - **Testing Required:** Comprehensive testing of node-level injection scenarios, state corruption, recovery patterns (high effort)
  - **Documentation:** Integration guide, examples, API documentation needed
  - **Metrics Enhancement:** May need graph-specific metrics (node-level MTTR, state consistency)
  - **Complexity Factors:**
    - Graph topology requires different test patterns than sequential agents
    - State management and corruption scenarios are complex
    - Node-level granularity requires careful test design
    - Async execution in graphs adds concurrency complexity
  - **Positive Factors:**
    - Wrapper skeleton exists (reduces 40% of effort)
    - Architecture follows established patterns from other wrappers
    - Injector system is reusable without major changes
    - Core metrics already implemented

  **Estimated Breakdown:**
  - Analysis & Planning: ~4 hours
  - Testing (if needed improvements): ~8-12 hours
  - Documentation & Examples: ~4-6 hours
  - Code Review & Integration: ~2-3 hours
  - Total: ~18-25 hours (3-4 days of focused work)

  ---

  _Analysis completed during research phase. Implementation readiness: Ready to proceed with detailed planning._
