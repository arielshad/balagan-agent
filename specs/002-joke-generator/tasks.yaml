# Task Breakdown (YAML)
# Concrete implementation tasks with TDD cycles

name: joke-generator
summary: >
  26 implementation tasks across 5 phases. Core focus: state snapshots + field-level corruption (Phase 1),
  metrics enhancement + edge timing (Phase 2), dynamic node selection (Phase 3), async/concurrent execution
  (Phase 4), and comprehensive testing + documentation (Phase 5). Estimated total effort: 40 hours.

relatedFeatures: []
technologies: []
relatedLinks: []

tasks:
  # PHASE 1: State Management & Field-Level Corruption

  - id: task-1-1
    phaseId: phase-1
    title: 'Define StateSnapshot dataclass with deep copy semantics'
    description: >
      Create StateSnapshot dataclass to model state before/after chaos injection events.
      Dataclass should include timestamp, node_name, state_before, state_after (deep copies),
      fault_injected type, and target fields. This is the foundational data structure for
      understanding state mutations caused by chaos injection.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - 'StateSnapshot dataclass exists with all required fields'
      - 'state_before and state_after are deep copies (copy.deepcopy)'
      - 'StateSnapshot has timestamp property (float, nanoseconds or seconds)'
      - 'StateSnapshot is hashable and can be stored in sets/dicts'
      - 'StateSnapshot has __repr__ for debugging'
    tdd:
      red:
        - 'Write test: assert StateSnapshot can be created with all fields'
        - 'Write test: assert state_before/after are deep copies (modifications to copy don''t affect original)'
        - 'Write test: assert timestamp is recorded at creation'
      green:
        - 'Implement StateSnapshot dataclass with @dataclass decorator'
        - 'Use copy.deepcopy() for state_before and state_after'
        - 'Use time.time() or time.time_ns() for timestamp'
      refactor:
        - 'Add property accessors for common queries (e.g., changed_fields property)'
        - 'Optimize repr for readability with state size summary'
    estimatedEffort: '1.5h'

  - id: task-1-2
    phaseId: phase-1
    title: 'Create StateSnapshotManager in LangGraphWrapper'
    description: >
      Add state snapshot collection and retrieval to LangGraphWrapper.
      Manager tracks all snapshots per node execution and provides query API
      (by node name, by timestamp range, by fault type). This enables post-execution analysis
      of what state corruption actually occurred.
    state: Todo
    dependencies:
      - task-1-1
    acceptanceCriteria:
      - 'StateSnapshotManager stores snapshots in ordered list (thread-safe)'
      - 'get_snapshots_for_node(node_name) returns relevant snapshots'
      - 'get_snapshots_by_fault(fault_type) returns snapshots with that fault'
      - 'get_snapshots_in_time_range(start, end) filters by timestamp'
      - 'clear_snapshots() resets collection (for test isolation)'
    tdd:
      red:
        - 'Write test: assert snapshot added via add_snapshot() is retrievable'
        - 'Write test: assert get_snapshots_for_node filters correctly'
        - 'Write test: assert thread-safe adding from concurrent threads'
      green:
        - 'Implement StateSnapshotManager with list storage and Lock for thread safety'
        - 'Implement filter methods using list comprehensions'
      refactor:
        - 'Extract filtering logic to reusable methods'
        - 'Add type hints for all filter parameters'
    estimatedEffort: '1.5h'

  - id: task-1-3
    phaseId: phase-1
    title: 'Add field-level targeting to ContextCorruptionInjector'
    description: >
      Extend ContextCorruptionInjector to support target_fields parameter.
      When target_fields is specified, only corrupt those fields in the state.
      Validate field names against state schema and skip internal control flow fields.
      This enables precise state corruption for debugging specific failure modes.
    state: Todo
    dependencies:
      - task-1-1
    acceptanceCriteria:
      - 'ContextCorruptionInjector accepts target_fields parameter'
      - 'Injection only corrupts specified fields (verify via deep copy comparison)'
      - 'Control flow fields (marked with exclude_from_corruption=True) are never corrupted'
      - 'Invalid field names raise ValidationError with helpful message'
      - 'target_fields=None corrupts all corruptible fields (backward compatible)'
    tdd:
      red:
        - 'Write test: inject with target_fields=["messages"], verify only messages corrupted'
        - 'Write test: inject with invalid field name, expect ValidationError'
        - 'Write test: inject with control flow field, verify it''s skipped'
      green:
        - 'Add target_fields parameter to ContextCorruptionInjector.__init__'
        - 'Modify inject() to filter fields before corruption'
        - 'Use copy.deepcopy and field comparison to verify mutations'
      refactor:
        - 'Extract field validation to separate method'
        - 'Create helper for identifying corruptible fields'
    estimatedEffort: '2h'

  - id: task-1-4
    phaseId: phase-1
    title: 'Update LangGraphNodeProxy to capture state snapshots'
    description: >
      Modify LangGraphNodeProxy to capture before/after state snapshots when chaos is injected.
      Snapshots are stored via StateSnapshotManager. Capture occurs before chaos application
      and after node execution (whether successful or failed). Snapshots enable post-execution
      analysis of state mutations.
    state: Todo
    dependencies:
      - task-1-2
      - task-1-3
    acceptanceCriteria:
      - 'StateSnapshot captured before chaos injection'
      - 'StateSnapshot captured after node execution (success or failure)'
      - 'Snapshots stored in StateSnapshotManager'
      - 'Snapshots accessible via wrapper.get_state_snapshots()'
      - 'No snapshots captured when chaos injection disabled'
      - 'Performance impact <5% (snapshot overhead minimal)'
    tdd:
      red:
        - 'Write test: node executes with chaos, snapshots captured before and after'
        - 'Write test: assert snapshot state_before/after match actual state'
        - 'Write test: assert no snapshots when chaos disabled'
      green:
        - 'In node proxy __call__, capture snapshot before/after chaos'
        - 'Use StateSnapshotManager.add_snapshot() for storage'
        - 'Pass snapshot manager reference to proxy at init'
      refactor:
        - 'Extract snapshot capture logic to separate method for clarity'
        - 'Add type hints for state parameter'
    estimatedEffort: '2h'

  - id: task-1-5
    phaseId: phase-1
    title: 'Test state snapshot accuracy across multiple execution patterns'
    description: >
      Write comprehensive tests validating that state snapshots accurately capture
      state mutations from chaos injection. Test patterns: single mutation, multiple field corruptions,
      nested object mutations, list mutations, state size tracking. Ensure snapshots are deep copies
      and modifications don't affect original state.
    state: Todo
    dependencies:
      - task-1-4
    acceptanceCriteria:
      - 'Test: single field corruption captured in snapshot'
      - 'Test: multiple field corruptions captured'
      - 'Test: nested object mutations captured'
      - 'Test: list mutations (append, shuffle, delete) captured'
      - 'Test: snapshot modifications don''t affect original state'
      - 'Test: snapshot size metadata accurate'
    tdd:
      red:
        - 'Write parameterized test covering each mutation type'
        - 'Each test asserts snapshot state_before/after reflect mutations'
      green:
        - 'Create test fixture with complex state objects'
        - 'Run corruption and validate snapshot captures'
      refactor:
        - 'Extract state comparison logic to helper functions'
        - 'Organize tests by mutation type'
    estimatedEffort: '1.5h'

  # PHASE 2: Metrics Enhancement & Edge Timing

  - id: task-2-1
