    description: >
      Extend MetricsCollector to track edge traversal timing between nodes.
      New metrics: edge_id (source->target), traversal_start, traversal_end, delay_ms,
      state_mutation_size. Edges are transitions in the graph; timing them reveals control flow
      anomalies caused by chaos injection. This complements node-level timing from Phase 1.
    state: Todo
    dependencies:
      - task-1-4
    acceptanceCriteria:
      - 'MetricsCollector tracks edge traversal events'
      - 'Edge events have: source, target, start_time, end_time'
      - 'Edge delay calculated as end_time - start_time'
      - 'State mutation size recorded (bytes changed between nodes)'
      - 'get_edge_metrics() returns edge traversal data'
      - 'Edge metrics correlated with node execution metrics'
    tdd:
      red:
        - 'Write test: record edge traversal, verify timing captured'
        - 'Write test: calculate state mutation size between node executions'
        - 'Write test: get_edge_metrics returns expected structure'
      green:
