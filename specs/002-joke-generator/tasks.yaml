        - 'Implement state_mutation_size calculation via deepdiff or manual comparison'
      refactor:
        - 'Extract edge calculation logic to separate method'
        - 'Consolidate edge and node metric structures'
    estimatedEffort: '2h'

  - id: task-2-2
    phaseId: phase-2
    title: 'Implement node recovery time (MTTR) calculation'
    description: >
      Extend metrics collection to track recovery attempts and calculate Mean Time To Recovery (MTTR).
      MTTR = sum of retry delays + re-execution times. Metrics include: failure_time, first_retry_time,
      final_recovery_time, retry_count, total_recovery_ms. MTTR analysis reveals system resilience
      and guides reliability improvements.
    state: Todo
    dependencies:
      - task-2-1
    acceptanceCriteria:
      - 'Node failure recorded with timestamp'
      - 'Each retry tracked (delay, re-execution)'
      - 'MTTR calculated: sum of delays + execution times'
      - 'Recovery success/failure recorded'
      - 'get_mttr_stats(node_name) returns recovery metrics'
      - 'MTTR works with concurrent retries'
    tdd:
      red:
        - 'Write test: node fails, retry succeeds, MTTR calculated correctly'
        - 'Write test: multiple retries, MTTR includes all delays'
        - 'Write test: retry fails, final MTTR recorded with failure flag'
      green:
        - 'Track failure_time, retry_times, recovery_time in metrics'
        - 'Implement MTTR calculation in MTTRCalculator'
      refactor:
        - 'Extract MTTR logic to dedicated method'
        - 'Add type hints for timing values'
    estimatedEffort: '2h'

  - id: task-2-3
    phaseId: phase-2
    title: 'Add node execution timing hooks to node proxies'
    description: >
      Integrate node execution timing into existing node proxy classes.
